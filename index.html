<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioFFF Studio</title>
  <meta name="description"
    content="Multi-toolhead FDM bio-printer control station — FDM, hydrogel syringe and UV crosslinking" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#2f6098",         /* clinical blue */
            "primary-dark": "#1f548b",
            "primary-light": "#bbd6ff",
            action: "#2f6098",
            "background-light": "#f8f9fa",
            "background-dark": "#0c0f10",
            "surface-light": "#ffffff",
            "surface-dark": "#181a1b",
            "border-light": "#abb3b730",
            "border-dark": "#3c4042",
            "outline-variant": "#abb3b7",
            "surface-container": "#eaeff1",
            "surface-container-low": "#f1f4f6",
            "on-surface": "#2b3437",
            "on-surface-variant": "#586064",
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          },
          borderRadius: {
            'none': '0',
            'sm': '2px',
            'DEFAULT': '0',
            'md': '0',
            'lg': '0',
            'xl': '0',
          },
          fontSize: {
            'xxs': ['10px', '14px'],
            'label': ['11px', '15px'],
            'compact': ['12px', '16px'],
          },
        },
      },
    };
  </script>
  <style>
  /* ── Clinical Editorial ── */
  body {
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    background-color: #f8f9fa;
  }

  /* Sharp clinical corners */
  * { border-radius: 0 !important; }
  .rounded-sm, .rounded { border-radius: 2px !important; }

  /* Transitions */
  .btn-transition { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

  /* Tonal boundaries */
  .divider-tonal { border-bottom: 1px solid rgba(171, 179, 183, 0.15); }

  /* Typography Density */
  .label-clinical {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #586064;
    text-transform: uppercase;
  }

  .section-header {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #2b3437;
    text-transform: uppercase;
  }

  /* Sliders - High Density */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 2px;
    cursor: pointer;
    background: #eaeff1;
  }
  input[type=range]::-webkit-slider-thumb {
    height: 12px;
    width: 4px;
    background: #2f6098;
    cursor: pointer;
    -webkit-appearance: none;
    margin-top: -5px;
  }

  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #abb3b740; }
  </style>

</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 overflow-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
