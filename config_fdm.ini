# PrusaSlicer 2.9.x — FDM/FFF Profile for BioFFF Studio
# Printer Technology: FFF (Fused Filament Fabrication)
# Target: Klipper firmware via Moonraker
# Generated for: Multi-toolhead bio-printer with FDM, Syringe, and UV heads
#
# Usage: prusa-slicer-console.exe --load config_fdm.ini --export-gcode ...

# ── Printer Technology ──────────────────────────────────────────────────────
printer_technology = FFF

# ── Machine Geometry ────────────────────────────────────────────────────────
# Adjust bed_shape to match your actual build surface
bed_shape = 0x0,235x0,235x235,0x235
max_print_height = 250
machine_max_feedrate_x = 200
machine_max_feedrate_y = 200
machine_max_feedrate_z = 20
machine_max_feedrate_e = 120
machine_max_acceleration_x = 1500
machine_max_acceleration_y = 1500
machine_max_acceleration_z = 500
machine_max_acceleration_e = 5000
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 0.4
machine_max_jerk_e = 1.5

# ── G-code Flavor ───────────────────────────────────────────────────────────
gcode_flavor = klipper
use_relative_e_distances = 1
use_firmware_retraction = 0

# ── Start / End G-code ──────────────────────────────────────────────────────
start_gcode = PRINT_START EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
end_gcode = PRINT_END
toolchange_gcode = T[next_extruder]

# ── Layer Heights ────────────────────────────────────────────────────────────
layer_height = 0.2
first_layer_height = 0.3
min_layer_height = 0.05
max_layer_height = 0.35

# ── Extrusion ────────────────────────────────────────────────────────────────
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_width = 0
first_layer_extrusion_width = 0.42
perimeter_extrusion_width = 0
infill_extrusion_width = 0
solid_infill_extrusion_width = 0
top_infill_extrusion_width = 0
support_material_extrusion_width = 0
extrusion_multiplier = 1

# ── Retraction ───────────────────────────────────────────────────────────────
retract_length = 0.8
retract_speed = 35
retract_restart_extra = 0
retract_before_travel = 2
retract_lift = 0

# ── Speeds ───────────────────────────────────────────────────────────────────
perimeter_speed = 45
small_perimeter_speed = 25
external_perimeter_speed = 30
infill_speed = 80
solid_infill_speed = 60
top_solid_infill_speed = 40
support_material_speed = 60
travel_speed = 150
first_layer_speed = 25
bridge_speed = 30

# ── Print Parameters ─────────────────────────────────────────────────────────
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
fill_angle = 45
solid_infill_below_area = 70

# ── Temperature ──────────────────────────────────────────────────────────────
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 65

# ── Fan / Cooling ────────────────────────────────────────────────────────────
cooling = 1
min_fan_speed = 35
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 3

# ── Supports & Brim ──────────────────────────────────────────────────────────
support_material = 0
brim_width = 0
skirts = 1
skirt_distance = 3
skirt_height = 1

# ── Quality ───────────────────────────────────────────────────────────────────
avoid_crossing_perimeters = 1
gap_fill_enabled = 1
seam_position = aligned
only_retract_when_crossing_perimeters = 0

# ── Output ───────────────────────────────────────────────────────────────────
output_filename_format = [input_filename_base]_biofff.gcode
notes = BioFFF Studio FDM Profile — Klipper flavor, Gyroid infill, Multi-toolhead ready

[Hardware]
rpi_ip = 192.168.137.148
moonraker_port = 7125

