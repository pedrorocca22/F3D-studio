# =============================================================================
#  BioFFF Studio — Klipper printer.cfg Template
#  Multi-toolhead Bio-printer: FDM + Hydrogel Syringe + UV Crosslinker
#
#  Architecture:
#    T0 → FDM hot-end           (standard filament printing)
#    T1 → Cold syringe extruder (hydrogel / bioink mechanical plunger)
#    T2 → UV crosslinking head  (365nm / 405nm LED for photo-crosslinking)
#
#  Control: Klipper + Moonraker (REST API) on Raspberry Pi CM4
#  Communication from BioFFF Studio: Moonraker WebSocket + REST
# =============================================================================

# ---------------------------------------------------------------------------
#  MCU — Adjust serial/canbus to match your actual board
# ---------------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_XXXXXXXXXX-if00
# If using CANbus:
# canbus_uuid: XXXXXXXXXXXX

[mcu syringe]
# Second MCU board driving the syringe stepper
# Uncomment and configure if using a separate board
# serial: /dev/serial/by-id/usb-Klipper_stm32f103xx_XXXXXXXXXX-if00

# ---------------------------------------------------------------------------
#  Printer Kinematics
# ---------------------------------------------------------------------------
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2000
max_z_velocity: 20
max_z_accel: 400

# ---------------------------------------------------------------------------
#  Motion Axes
# ---------------------------------------------------------------------------
[stepper_x]
step_pin: PE2
dir_pin: PB4
enable_pin: !PC11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF3
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PF12
dir_pin: PF11
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF4
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PD7
dir_pin: !PD6
enable_pin: !PF10
microsteps: 16
rotation_distance: 8          # Adjust to your Z leadscrew pitch
endstop_pin: probe:z_virtual_endstop
position_min: -1
position_max: 250
homing_speed: 10
second_homing_speed: 3

# ---------------------------------------------------------------------------
#  T0 — FDM Hot-end Extruder
# ---------------------------------------------------------------------------
[extruder]
step_pin: PD5
dir_pin: !PD4
enable_pin: !PD6
microsteps: 16
rotation_distance: 7.8        # Calibrate with E-step calibration
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF4
min_temp: 0
max_temp: 280
min_extrude_temp: 170
max_extrude_cross_section: 50
max_extrude_only_distance: 100

[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF3
min_temp: 0
max_temp: 110

[fan]
pin: PA8  # Part cooling fan

[heater_fan extruder_fan]
pin: PE5
heater: extruder
heater_temp: 50

# ---------------------------------------------------------------------------
#  T1 — Cold Syringe Extruder (hydrogel / bioink)
#  The syringe plunger is driven by a stepper via a leadscrew or rack.
#  No heating required. Uses a separate extruder definition.
# ---------------------------------------------------------------------------
[extruder1]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 0.5        # mm of plunger travel per full rotation
                              # = thread pitch × (1 / gear_ratio)
nozzle_diameter: 0.600        # Syringe needle ID
filament_diameter: 1.000      # Virtual value for Klipper volume math
heater_pin:                   # No heater for cold extrusion — leave blank
sensor_type: temperature_host # Placeholder — host temperature sensor
min_temp: -200                # Allow operation at any temperature
max_temp: 100
min_extrude_temp: -200
max_extrude_cross_section: 200
max_extrude_only_distance: 500

[verify_heater extruder1]
check_gain_time: 300          # Disable over-heating checks for cold extruder
hysteresis: 100
max_error: 9999
heating_gain: 0

# ---------------------------------------------------------------------------
#  T2 — UV Crosslinking Head
#  LED controlled via digital output pin.
#  Movement of this head can be done via a dedicated servo or
#  by parking to a fixed position (simpler).
# ---------------------------------------------------------------------------
[output_pin uv_led]
pin: PE3
value: 0                      # Start with UV off

# ---------------------------------------------------------------------------
#  Probe / Bed Leveling (optional but recommended)
# ---------------------------------------------------------------------------
[probe]
pin: ~PF6
x_offset: -44.0
y_offset: -12.0
z_offset: 0.1
speed: 5.0
samples: 3
sample_retract_dist: 2.0

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 15, 15
mesh_max: 185, 185
probe_count: 5, 5

[safe_z_home]
home_xy_position: 117, 117
speed: 80
z_hop: 10

# ---------------------------------------------------------------------------
#  Multiple Extruder (Toolhead Switcher)
#  Switch between T0 (FDM) and T1 (Syringe) using standard T macros.
# ---------------------------------------------------------------------------

[duplicate_pin_override]
pins: PA14  # Override for syringe extruder if sharing pins

# ---------------------------------------------------------------------------
#  Macros — Toolhead switching
# ---------------------------------------------------------------------------

[gcode_macro T0]
description: Activate T0 FDM hot-end
gcode:
  SAVE_GCODE_STATE NAME=toolchange_state
  {% if printer.toolhead.extruder != 'extruder' %}
    G91
    G1 Z5 F600           ; lift before toolchange
    G90
    M117 Switching to FDM (T0)
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    G28 X                ; re-home X if IDEX
    M400
  {% endif %}
  RESTORE_GCODE_STATE NAME=toolchange_state

[gcode_macro T1]
description: Activate T1 Syringe cold extruder
gcode:
  SAVE_GCODE_STATE NAME=toolchange_state
  {% if printer.toolhead.extruder != 'extruder1' %}
    G91
    G1 Z5 F600           ; lift before toolchange
    G90
    M117 Switching to Syringe (T1)
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    M400
  {% endif %}
  RESTORE_GCODE_STATE NAME=toolchange_state

[gcode_macro T2]
description: Park and prepare UV crosslinking head
gcode:
  G91
  G1 Z3 F600
  G90
  G1 X117 Y117 F3000    ; Move to center for UV exposure
  M400
  M117 UV Head (T2) positioned

# ---------------------------------------------------------------------------
#  Macros — UV Crosslinking
# ---------------------------------------------------------------------------

[gcode_macro UV_EXPOSE]
description: Expose with UV crosslinking LED
gcode:
  {% set DURATION = params.DURATION|default(5.0)|float %}
  {% set DOSE    = params.DOSE|default(0)|float %}
  M117 UV Expose: {DURATION}s / {DOSE} mJ/cm2
  SET_PIN PIN=uv_led VALUE=1
  G4 P{(DURATION * 1000)|int}   ; dwell in milliseconds
  SET_PIN PIN=uv_led VALUE=0
  M117 UV crosslink done

[gcode_macro UV_OFF]
description: Turn off UV LED immediately
gcode:
  SET_PIN PIN=uv_led VALUE=0
  M117 UV off

# ---------------------------------------------------------------------------
#  Macros — Syringe Control
# ---------------------------------------------------------------------------

[gcode_macro SYRINGE_PRESSURIZE]
description: Pre-pressurize syringe plunger (anti-drip priming)
gcode:
  {% set STEPS = params.STEPS|default(50)|int %}
  M117 Syringe: pressurizing {STEPS} steps
  ACTIVATE_EXTRUDER EXTRUDER=extruder1
  G92 E0
  G1 E{STEPS * 0.001} F10   ; Very slow forward push
  G92 E0
  M400

[gcode_macro SYRINGE_RETRACT]
description: Syringe anti-drip retraction after printing
gcode:
  {% set STEPS = params.STEPS|default(30)|int %}
  M117 Syringe: retracting {STEPS} steps
  ACTIVATE_EXTRUDER EXTRUDER=extruder1
  G92 E0
  G1 E-{STEPS * 0.001} F30  ; Slow retraction
  G92 E0
  M400

# ---------------------------------------------------------------------------
#  Macros — Print start / end (called from G-code start_gcode in config_fdm.ini)
# ---------------------------------------------------------------------------

[gcode_macro PRINT_START]
description: BioFFF print start routine
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|int %}
  {% set BED_TEMP      = params.BED_TEMP|default(60)|int %}
  G28                              ; Home all axes
  BED_MESH_CALIBRATE               ; Auto bed leveling
  G1 X0.1 Y20 Z0.3 F5000          ; Move to prime position
  M104 S{EXTRUDER_TEMP}            ; Set extruder temperature (don't wait)
  M190 S{BED_TEMP}                 ; Wait for bed to reach temperature
  M109 S{EXTRUDER_TEMP}            ; Wait for extruder to reach temperature
  G92 E0                           ; Reset extruder
  G1 X0.1 Y200 Z0.3 E15 F1500     ; Prime line (purge)
  G1 X0.4 Y200 Z0.3 F5000
  G1 X0.4 Y20 E30 F1500
  G92 E0                           ; Reset extruder after purge
  M117 BioFFF Print Starting...

[gcode_macro PRINT_END]
description: BioFFF print end routine
gcode:
  UV_OFF                           ; Ensure UV is off
  G91
  G1 E-5 F3600                     ; Retract 5mm
  G1 Z5 F600                       ; Lift
  G90
  G28 X Y                          ; Home X Y
  M104 S0                          ; Turn off extruder heater
  M140 S0                          ; Turn off bed heater
  M84                              ; Disable motors
  M117 Print complete!

# ---------------------------------------------------------------------------
#  Pause / Resume (used by BioFFF UV crosslink workflow)
# ---------------------------------------------------------------------------

[pause_resume]

[gcode_macro PAUSE]
description: Pause print (called by BioFFF Studio for UV crosslink)
rename_existing: BASE_PAUSE
gcode:
  SAVE_GCODE_STATE NAME=pause_state
  BASE_PAUSE
  G91
  G1 Z10 F600
  G90
  M117 Print paused

[gcode_macro RESUME]
description: Resume print after pause
rename_existing: BASE_RESUME
gcode:
  G91
  G1 Z-10 F600
  G90
  RESTORE_GCODE_STATE NAME=pause_state MOVE=1
  BASE_RESUME
  M117 Resuming print...

[gcode_macro CANCEL_PRINT]
description: Cancel ongoing print
rename_existing: BASE_CANCEL_PRINT
gcode:
  UV_OFF
  TURN_OFF_HEATERS
  BASE_CANCEL_PRINT
  G28 X Y
  M84
  M117 Print cancelled

# ---------------------------------------------------------------------------
#  Moonraker integration
# ---------------------------------------------------------------------------
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[exclude_object]
